name: Beginner Task
description: 오픈소스 기여가 처음인 개발자를 위한 작업을 등록합니다.
title: "[Beginner] "
labels:
  - beginner
  - good first issue
body:
  - type: markdown
    attributes:
      value: |
        초보 기여자를 위한 Issue입니다.

        작업 목적, 수정 범위, 완료 조건과 PR 처리 방식을 명확하게 작성해 주세요.

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 이 작업이 왜 필요한지 설명해 주세요.
      placeholder: 이 작업을 통해 해결하려는 문제를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: 수정할 파일
      description: 기여자가 수정해야 하는 파일을 작성해 주세요.
      placeholder: |
        예:
        - contribution-lab/contributors.json
        - contribution-lab/docs/glossary.md
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 구체적으로 무엇을 수정해야 하는지 단계별로 작성해 주세요.
      placeholder: |
        1. 파일을 엽니다.
        2. 지정된 내용을 추가합니다.
        3. 변경 내용을 확인합니다.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 완료 조건
      description: 작업이 완료됐다고 판단하는 기준을 작성해 주세요.
      placeholder: |
        - 지정된 파일만 수정됨
        - JSON 문법 오류가 없음
        - 실제 개인정보가 포함되지 않음
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: 확인 방법
      description: 기여자가 변경 내용을 확인하는 방법을 작성해 주세요.
      placeholder: 실행할 명령어나 직접 확인할 항목을 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 예상 난이도
      options:
        - 매우 쉬움
        - 쉬움
        - 보통
    validations:
      required: true

  - type: dropdown
    id: estimated-time
    attributes:
      label: 예상 소요 시간
      options:
        - 10분 이내
        - 30분 이내
        - 1시간 이내
        - 2시간 이내
    validations:
      required: true

  - type: dropdown
    id: pr-scenario
    attributes:
      label: Pull Request 처리 시나리오
      description: Green Commit 상태 추적 테스트에 사용할 처리 방식을 선택해 주세요.
      options:
        - 일반 검토 후 Merge
        - 테스트를 위해 Merge
        - 테스트를 위해 Close
        - 일정 기간 Open 유지
        - Close 후 Reopen
        - Draft 상태 확인
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 등록 전 확인
      options:
        - label: 실제 Secret이나 개인정보가 포함되지 않았습니다.
          required: true
        - label: 초보자가 이해할 수 있도록 작업 범위를 구체적으로 작성했습니다.
          required: true
        - label: 테스트용 PR이라면 처리 방식을 명확하게 안내했습니다.
          required: true