name: Bug Report
description: 재현 가능한 버그를 신고합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        버그 신고 전에 실제 API Key, Token, 비밀번호 또는 개인정보가 포함되지 않았는지 확인해 주세요.

        보안 취약점은 공개 Issue가 아니라 SECURITY.md에 안내된 비공개 방법으로 신고해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 버그 요약
      description: 발생한 문제를 간단히 설명해 주세요.
      placeholder: 어떤 기능에서 어떤 문제가 발생했는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 문제를 다시 발생시킬 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. 애플리케이션을 실행합니다.
        2. 특정 화면으로 이동합니다.
        3. 특정 버튼을 누릅니다.
        4. 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상한 결과
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 어떤 일이 발생했는지 작성해 주세요.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: 예: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch 또는 Commit
      placeholder: 예: master 또는 커밋 SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 오류 메시지 또는 로그
      description: Secret과 개인정보를 제거한 뒤 필요한 부분만 첨부해 주세요.
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: 확인 사항
      options:
        - label: 같은 문제가 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 로그에서 Secret과 개인정보를 제거했습니다.
          required: true
        - label: 보안 취약점 신고가 아님을 확인했습니다.
          required: true